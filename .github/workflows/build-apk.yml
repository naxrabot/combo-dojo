name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Put the combo data into the app
        run: node tools/embed.mjs

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle --no-daemon assembleRelease

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk ComboDojo-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ComboDojo-${{ github.run_number }}
          path: ComboDojo-${{ github.run_number }}.apk

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Combo Dojo build ${{ github.run_number }}
          files: ComboDojo-${{ github.run_number }}.apk
          make_latest: true
